<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Educativo</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        emailjs.init({
            publicKey: "TU_PUBLIC_KEY"
        });
    </script>
</head>
<body>

<div class="contenedor">

<h2>Formulario de Práctica</h2>

<p>
Este formulario es únicamente para fines educativos.
Los datos serán enviados al correo del investigador únicamente con el consentimiento del participante.
</p>

<form id="formulario">

<input type="text" name="nombre" placeholder="Nombre" required>

<input type="email" name="correo" placeholder="Correo" required>

<input type="number" name="edad" placeholder="Edad" required>

<input type="text" name="ciudad" placeholder="Ciudad">

<label>
<input type="checkbox" required>
Acepto que esta información sea enviada con fines educativos.
</label>

<button type="submit">Enviar</button>

</form>

</div>

<script src="script.js"></script>

</body>
</html>
